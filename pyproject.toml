[project]
name = "candy_uncle_bot"
version = "0.1.0"
description = "Aiogram Bot for self-use (ai, media-download, scraper, helper, etc.)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.1",
    "httpx[h2]>=0.27.0",
    "yt-dlp>=2025.9.5",
]


[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"
