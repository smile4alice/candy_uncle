services:

  redis:
    image: redis:7.2.4
    container_name: redis_uncle
    ports:
      - $REDIS_PORT:$REDIS_PORT
    command: [--requirepass $REDIS_PASSWORD]
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - uncle
    healthcheck:
      test: "redis-cli --raw ping"
      interval: 2s
      timeout: 15s

  backend:
    image: backend_image_uncle
    build:
      context: .
    container_name: backend_uncle
    env_file:
      - .env
    ports:
      - "${WEB_SERVER_PORT:-5000}:${WEB_SERVER_PORT:-5000}"
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - backend_data:/backend_app/media
    networks:
      - uncle

networks:
  uncle:
    driver: bridge

volumes:
  redis_data:
  backend_data:
